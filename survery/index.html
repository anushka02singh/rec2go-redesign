<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rec2Go Student Survey</title></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* One phone-width column, one screen per step, styled like the Rec2Go redesign prototype. */
:root {
  --bg: #f6f4f1;
  --card: #ffffff;
  --ink: #1d1d22;
  --muted: #5e6068;
  --line: #e2ddd5;
  --brand: #cc0033;
  --brand-ink: #ffffff;
  --brand-soft: #fbe8ed;
  --ok: #17784a;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151a; --card: #221f25; --ink: #f1eef0; --muted: #b0a9b0; --line: #3a353d;
    --brand: #ff4d6d; --brand-ink: #17151a; --brand-soft: #3a1d26; --ok: #5fd39b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17151a; --card: #221f25; --ink: #f1eef0; --muted: #b0a9b0; --line: #3a353d;
  --brand: #ff4d6d; --brand-ink: #17151a; --brand-soft: #3a1d26; --ok: #5fd39b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; margin: 0;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 480px; margin: 0 auto; min-width: 0; }
h1, h2 { line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 28px; }
h2 { font-size: 21px; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-weight: 700; color: var(--brand); letter-spacing: 0.06em; font-size: 13px; text-transform: uppercase; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.primary { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 600; width: 100%; }
.primary[disabled] { opacity: 0.4; cursor: not-allowed; }
.ghost { background: transparent; color: var(--muted); border: 0; padding: 10px 4px; text-decoration: underline; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--brand); width: 0; transition: width 0.2s; }
@media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
.q { display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.q legend, .q .t { font-weight: 600; padding: 0; margin-bottom: 4px; }
.hint { font-size: 13px; color: var(--muted); font-weight: 400; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale button { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 0; font-weight: 600; }
.scale button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.opt { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.opt input { margin-top: 4px; accent-color: var(--brand); flex: none; }
.opt:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.skip { font-size: 13px; color: var(--muted); }
textarea { width: 100%; min-height: 96px; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; resize: vertical; }
.result { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.ok { color: var(--ok); font-weight: 600; }
a { color: var(--brand); }
</style>

<main id="app" class="stack" aria-live="polite"></main>

<script>
// ---- Survey content (edit these to change the questions) ----
// Each page is a list of questions. Types: "one" (pick one), "many" (pick any), "scale" (1-5), "text" (optional).
var PAGES = [
  { title: "About you", qs: [
    { id: "year", type: "one", req: true, t: "What year are you?",
      o: [["fy", "First year"], ["so", "Sophomore"], ["jr", "Junior"], ["sr", "Senior"], ["grad", "Graduate student"]] },
    { id: "freq", type: "one", req: true, t: "How often do you go to a Rutgers rec center?",
      o: [["3plus", "3 or more times a week"], ["1to2", "1 to 2 times a week"], ["month", "A few times a month"], ["rare", "Rarely"], ["never", "Never"]] },
    { id: "where", type: "many", t: "Which rec centers do you use?", h: "Choose all that apply",
      o: [["cag", "College Ave Gym"], ["swrc", "Sonny Werblin Rec Center (Busch)"], ["lrc", "Livingston Rec Center"],
          ["cdr", "Cook/Douglass Rec Center"], ["easton", "Rutgers Fitness Center @ Easton Ave"], ["none", "None"]] },
    { id: "do", type: "many", t: "What do you usually do there?", h: "Choose all that apply",
      o: [["lift", "Lift weights / fitness center"], ["cardio", "Cardio"], ["classes", "Group fitness classes"],
          ["pickup", "Pickup basketball or other open-court sports"], ["swim", "Swimming"], ["climb", "Climbing"],
          ["im", "Intramural sports"], ["other", "Something else"]] }
  ] },
  { title: "Using the Rec2Go app", qs: [
    { id: "app", type: "one", req: true, t: "Do you have the Rec2Go app?",
      o: [["regular", "Yes, and I use it regularly"], ["rarely", "Yes, but I rarely open it"], ["deleted", "I used to but deleted it"], ["no", "No, never had it"]] },
    { id: "entry", type: "one", t: "How do you usually get into the building?",
      o: [["app", "Member pass in the Rec2Go app"], ["card", "Physical Rutgers ID card"], ["both", "Mix of both"]] },
    { id: "uses", type: "many", t: "What do you use Rec2Go (or the Rutgers Rec website) for?", h: "Choose all that apply",
      o: [["pass", "Showing my member pass at the entrance"], ["hours", "Checking if a gym is open / hours"],
          ["sched", "Checking the group fitness class schedule"], ["reg", "Registering for classes, trips or programs"],
          ["events", "Events and intramurals"], ["neither", "I don’t use either"]] }
  ] },
  { title: "How much do you agree?", sub: "1 = strongly disagree, 5 = strongly agree. Skip any that don’t apply to you.", qs: [
    { id: "r_pass", type: "scale", t: "Getting my member pass on screen at the entrance is quick." },
    { id: "r_open", type: "scale", t: "It’s easy to find out whether a gym is open right now." },
    { id: "r_space", type: "scale", t: "It’s easy to find which gym has the space I need (a court, the pool, etc.)." },
    { id: "r_class", type: "scale", t: "It’s easy to find and sign up for a class." },
    { id: "r_trust", type: "scale", t: "The app feels modern and trustworthy." },
    { id: "surprise", type: "one", t: "Have you ever shown up and found the gym closed, too crowded, or the space you wanted taken?",
      o: [["never", "Never"], ["once", "Once"], ["few", "A few times"], ["often", "Often"]] }
  ] },
  { title: "Your experience", sub: "All optional, but these help the most. A sentence or two is plenty.", qs: [
    { id: "fail", type: "text", t: "Tell me about a time Rec2Go or the Rutgers Rec website didn’t give you what you needed." },
    { id: "annoy", type: "text", t: "What annoys you most about the app?" },
    { id: "wish", type: "text", t: "If the app could do one thing for you in the 30 seconds before you walk in, what would it be?" },
    { id: "else", type: "text", t: "Anything else the people running the rec centers should know?" }
  ] }
];

var state = { step: -1, a: {} };   // step -1 intro, 0..PAGES.length-1 pages, PAGES.length done
var app = document.getElementById("app");

function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined) return;
    if (k === "text") n.textContent = v;
    else if (k === "class") n.className = v;
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  });
  (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
  return n;
}
function go(step) { state.step = step; render(); window.scrollTo(0, 0); }

function intro() {
  return el("div", { class: "stack" }, [
    el("div", { class: "eyebrow", text: "Rec2Go redesign · student survey" }),
    el("h1", { text: "Help redesign the Rutgers Rec app" }),
    el("p", { text: "I’m a Rutgers student redesigning Rec2Go, the Rutgers Recreation app, for an interaction design class. Tell me how you use the rec centers and what gets in your way." }),
    el("div", { class: "panel stack" }, [
      el("p", { class: "small", text: "Takes about 5 minutes. No name, email or account. Nothing is sent anywhere: at the end you copy your answers and send them to the person who shared this link." }),
      el("p", { class: "small", text: "You need to be 18 or older. Your anonymous answers will be summarized in a class project and portfolio case study. You can stop at any time by closing the page." })
    ]),
    el("button", { class: "primary", text: "I’m 18+ and agree, start", onclick: function () { go(0); } })
  ]);
}

function oneQ(q) {
  return el("fieldset", { class: "q" }, [
    el("legend", { text: q.t })
  ].concat(q.o.map(function (o) {
    var id = q.id + "_" + o[0];
    var input = el("input", { type: "radio", name: q.id, value: o[0], id: id });
    if (state.a[q.id] === o[0]) input.checked = true;
    input.addEventListener("change", function () { state.a[q.id] = o[0]; checkPage(); });
    return el("label", { class: "opt", for: id }, [input, el("span", { text: o[1] })]);
  })));
}

function manyQ(q) {
  var cur = state.a[q.id] || [];
  return el("fieldset", { class: "q" }, [
    el("legend", {}, [el("span", { text: q.t }), q.h ? el("div", { class: "hint", text: q.h }) : null])
  ].concat(q.o.map(function (o) {
    var id = q.id + "_" + o[0];
    var input = el("input", { type: "checkbox", name: q.id, value: o[0], id: id });
    if (cur.indexOf(o[0]) >= 0) input.checked = true;
    input.addEventListener("change", function () {
      var list = (state.a[q.id] || []).filter(function (x) { return x !== o[0]; });
      if (input.checked) list.push(o[0]);
      state.a[q.id] = list;
    });
    return el("label", { class: "opt", for: id }, [input, el("span", { text: o[1] })]);
  })));
}

function scaleQ(q) {
  var cur = state.a[q.id];
  var btns = [1, 2, 3, 4, 5].map(function (v) {
    return el("button", {
      type: "button", text: String(v), "aria-pressed": cur === v ? "true" : "false",
      "aria-label": q.t + " " + v + " of 5",
      onclick: function () { state.a[q.id] = (state.a[q.id] === v ? undefined : v); render(); }
    });
  });
  return el("div", { class: "q", role: "group", "aria-label": q.t }, [
    el("div", { class: "t", text: q.t }),
    el("div", { class: "scale" }, btns),
    el("div", { class: "ends" }, [el("span", { text: "Strongly disagree" }), el("span", { text: "Strongly agree" })])
  ]);
}

function textQ(q) {
  var id = "t_" + q.id;
  var ta = el("textarea", { id: id, maxlength: "1000" });
  ta.value = state.a[q.id] || "";
  ta.addEventListener("input", function () { state.a[q.id] = ta.value; });
  return el("div", { class: "q" }, [el("label", { class: "t", for: id, text: q.t }), ta]);
}

function pageReady(p) {
  return PAGES[p].qs.every(function (q) { return !q.req || state.a[q.id]; });
}
function checkPage() {
  var b = document.getElementById("nextbtn");
  if (b) b.disabled = !pageReady(state.step);
}

function pageScreen(p) {
  var page = PAGES[p];
  var qs = page.qs.map(function (q) {
    if (q.type === "one") return oneQ(q);
    if (q.type === "many") return manyQ(q);
    if (q.type === "scale") return scaleQ(q);
    return textQ(q);
  });
  var last = p === PAGES.length - 1;
  return el("div", { class: "stack" }, [
    el("div", { class: "small muted", text: "Part " + (p + 1) + " of " + PAGES.length }),
    el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(PAGES.length), "aria-valuenow": String(p) },
      [el("div", { style: "width:" + (p / PAGES.length * 100) + "%" })]),
    el("h2", { text: page.title }),
    page.sub ? el("p", { class: "small muted", text: page.sub }) : null,
    el("div", { class: "stack" }, qs),
    el("button", { class: "primary", id: "nextbtn", text: last ? "See my answers" : "Next",
      disabled: pageReady(p) ? null : "disabled", onclick: function () { go(p + 1); } }),
    p > 0 ? el("button", { class: "ghost", text: "Back", onclick: function () { go(p - 1); } }) : null
  ]);
}

// Readable summary that pastes cleanly into a notes app, with a compact data line at the end for analysis.
function summary() {
  var lines = ["REC2GO SURVEY v1"];
  PAGES.forEach(function (page) {
    page.qs.forEach(function (q) {
      var v = state.a[q.id], out;
      if (v === undefined || v === "" || (Array.isArray(v) && !v.length)) out = "(skipped)";
      else if (q.type === "one") out = q.o.filter(function (o) { return o[0] === v; })[0][1];
      else if (q.type === "many") out = q.o.filter(function (o) { return v.indexOf(o[0]) >= 0; }).map(function (o) { return o[1]; }).join("; ");
      else if (q.type === "scale") out = v + "/5";
      else out = v.trim().replace(/\s+/g, " ");
      lines.push(q.id + ": " + out);
    });
  });
  return lines.join("\n");
}

function doneScreen() {
  var text = summary();
  var ta = el("textarea", { class: "result", id: "out", readonly: "readonly", "aria-label": "Your answers", style: "min-height:220px" });
  ta.value = text;
  var msg = el("p", { class: "small muted", role: "status", text: "" });
  var copy = el("button", { class: "primary", text: "Copy my answers", onclick: function () {
    function fallback() { ta.focus(); ta.select(); msg.textContent = "Select the text above and copy it."; }
    try {
      navigator.clipboard.writeText(text).then(function () {
        msg.textContent = "Copied. Paste it into a message to the person who sent you this link.";
      }, fallback);
    } catch (e) { fallback(); }
  } });
  return el("div", { class: "stack" }, [
    el("div", { class: "ok", text: "Thank you!" }),
    el("h2", { text: "Last step: send your answers back" }),
    el("p", { text: "Tap the button, then paste the text into a text or DM to the person who shared this link. It contains only your answers." }),
    ta, copy, msg,
    el("button", { class: "ghost", text: "Change an answer", onclick: function () { go(PAGES.length - 1); } })
  ]);
}

function render() {
  app.textContent = "";
  var s = state.step;
  app.appendChild(s === -1 ? intro() : s < PAGES.length ? pageScreen(s) : doneScreen());
}
render();
</script>
</body></html>
